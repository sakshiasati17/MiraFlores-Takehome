# ReturnGuard dependency map: source field -> return line -> approval item.
# impact.py (Session 2) walks this file to decide which approvals a changed field makes stale.
# Keys are "FORM:box". W-2c corrections map onto the W-2 fields they correct
# (see forms.yaml: W-2c.correction.corrects).
#
# Tax year: 2025. www.irs.gov was blocked by the Session 1 and Session 2 sandbox network policy.
# Items marked "confirmed by Sakshi from the IRS page, 2026-11-02" were opened and quoted by Sakshi.
# Everything else was checked only via IRS-site search excerpts and is marked # UNVERIFIED
# until someone opens the page (see HANDOFF.md).
# Anything not confirmed by an IRS source is marked # UNVERIFIED; mappings also carry
# `unverified: true` so impact.py can show the flag (comments are not visible to code).
#
# Scope note: only DIRECT dependencies are modelled. Knock-on effects through totals
# (e.g. line 9 total income, line 15 taxable income) are out of scope: no tax computation.

version: 1
tax_year: 2025

approval_items:
  APR-1040-L1A:  "Form 1040 line 1a: wages (from W-2 box 1)"
  APR-WAGE-WP:   "Wage workpaper (W-2 tie-out)"
  APR-1040-L3A:  "Form 1040 line 3a: qualified dividends"
  APR-QDCG-WS:   "Qualified Dividends and Capital Gain Tax Worksheet"
  APR-1040-L3B:  "Form 1040 line 3b: ordinary dividends"
  APR-SCHD-L13:  "Schedule D line 13: capital gain distributions"
  APR-1040-L25A: "Form 1040 line 25a: federal tax withheld from Form(s) W-2"
  APR-1040-L25B: "Form 1040 line 25b: federal tax withheld from Form(s) 1099"

dependencies:
  "1099-DIV:1b":
    # Source: https://www.irs.gov/instructions/i1040sd (2025): "qualified dividends on Form 1040,
    # 1040-SR, or 1040-NR, line 3a". confirmed by Sakshi from the IRS page, 2026-11-02.
    # Worksheet: same page: "complete the Qualified Dividends and Capital Gain Tax Worksheet in the
    # instructions for Form 1040, line 16". confirmed by Sakshi from the IRS page, 2026-11-02.
    # Which worksheet LINES take 1b / 2a: # UNVERIFIED
    - return_line: "Form 1040 line 3a"
      approval: APR-1040-L3A
      source: "https://www.irs.gov/instructions/i1040sd"
    - return_line: "Qualified Dividends and Capital Gain Tax Worksheet"
      approval: APR-QDCG-WS
      source: "https://www.irs.gov/instructions/i1040gi"   # worksheet is in 1040 instr. line 16 (confirmed); # UNVERIFIED: which worksheet lines
      unverified: true   # data flag read by impact.py (YAML comments are lost on load)

  "1099-DIV:1a":
    # Source (paraphrased from IRS search excerpt): 2025 Form 1040 instructions, line 3b:
    # enter total ordinary dividends on line 3b; this amount should be shown in box 1a of Form(s) 1099-DIV.
    # https://www.irs.gov/instructions/i1040gi   # UNVERIFIED (page not yet opened)
    - return_line: "Form 1040 line 3b"
      approval: APR-1040-L3B
      source: "https://www.irs.gov/instructions/i1040gi"
      unverified: true

  "1099-DIV:2a":
    # Source: https://www.irs.gov/instructions/i1040sd (2025): "Enter on Schedule D, line 13, the
    # total capital gain distributions paid to you during the year, regardless of how long you held
    # your investment. This amount is shown in box 2a of Form 1099-DIV." confirmed by Sakshi from the IRS page, 2026-11-02.
    # Note: capital gain distributions not reported on Schedule D go on Form 1040 line 7a. Same page:
    # "capital gain distributions not reported directly on Form 1040 or 1040-SR, line 7a".
    # confirmed by Sakshi from the IRS page, 2026-11-02. This prototype assumes Schedule D is filed.
    - return_line: "Schedule D line 13"
      approval: APR-SCHD-L13
      source: "https://www.irs.gov/instructions/i1040sd"
    - return_line: "Qualified Dividends and Capital Gain Tax Worksheet"
      approval: APR-QDCG-WS
      source: "https://www.irs.gov/instructions/i1040gi"   # worksheet is in 1040 instr. line 16 (confirmed); # UNVERIFIED: which worksheet lines
      unverified: true   # data flag read by impact.py (YAML comments are lost on load)

  "1099-DIV:4":
    # UNVERIFIED (page not yet opened). 2025 Form 1040 instructions, line 25b: federal income tax withheld on
    # Form(s) 1099 (including dividends) goes on line 25b. The search excerpt did not
    # name 1099-DIV box 4 itself; box 4 = "Federal income tax withheld" is from the
    # 1099-DIV box list in config/forms.yaml.
    # https://www.irs.gov/instructions/i1040gi ; form layout https://www.irs.gov/pub/irs-pdf/f1040.pdf
    - return_line: "Form 1040 line 25b"
      approval: APR-1040-L25B
      source: "https://www.irs.gov/instructions/i1040gi"
      unverified: true

  "W-2:1":
    # UNVERIFIED (page not yet opened). 2025 Form 1040 instructions, line 1a: "Enter the total amount from Form(s) W-2, box 1."
    # https://www.irs.gov/instructions/i1040gi
    - return_line: "Form 1040 line 1a"
      approval: APR-1040-L1A
      source: "https://www.irs.gov/instructions/i1040gi"
      unverified: true
    - return_line: "Wage workpaper"
      approval: APR-WAGE-WP
      source: "internal workpaper (synthetic; not an IRS line)"

  "W-2:2":
    # UNVERIFIED (page not yet opened). 2025 Form 1040 instructions, line 25a: "Add the amounts shown as federal income
    # tax withheld on your Form(s) W-2 ... The amount withheld should be shown in box 2 of Form W-2."
    # https://www.irs.gov/instructions/i1040gi
    - return_line: "Form 1040 line 25a"
      approval: APR-1040-L25A
      source: "https://www.irs.gov/instructions/i1040gi"
      unverified: true
